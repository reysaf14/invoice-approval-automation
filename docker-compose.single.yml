services:
  # ==========================================
  # n8n Single Mode (for webhook testing)
  # ==========================================
  n8n-single:
    image: n8nio/n8n:1.74.0
    container_name: n8n-single
    restart: unless-stopped
    ports:
      - "5679:5678"  # Different port to avoid conflict
    environment:
      # Core
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=test123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5679  # A4 fix: base URL, tanpa sufiks
      - GENERIC_TIMEZONE=Asia/Jakarta
      # Single mode (not queue)
      - N8N_MODE=regular
      - EXECUTIONS_MODE=regular
      - N8N_ENCRYPTION_KEY=test_encryption_key_32_bytes_long!!
      # Database
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=dummy_postgres_password
      # Logging
      - N8N_LOG_LEVEL=debug
      - N8N_LOG_OUTPUT=console
    volumes:
      - n8n_data_single:/home/node/.n8n
      - ./credentials:/home/node/.gcp:ro
      - ./n8n-workflows:/home/node/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - n8n-network

  # ==========================================
  # PostgreSQL (shared)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres-single
    restart: unless-stopped
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=dummy_postgres_password
    volumes:
      - postgres_data_single:/var/lib/postgresql/data
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  n8n_data_single:
  postgres_data_single:

networks:
  n8n-network:
    driver: bridge
